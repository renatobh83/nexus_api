<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ticket Manager - Vue</title>
  <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <title>Ticket Manager Vue - Chat e Configurações</title>
  <!--  Css-->
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <div class="app-container" id="app">
    <template v-if="isAuthenticated">

      <!-- Header com usuário e logout -->
      <div class="app-header">
        <div class="user-profile" @click="toggleUserMenu">
          <div class="user-name">{{ currentUser?.name }}</div>
          <span class="dropdown-arrow">▼</span>
        </div>

        <!-- Menu dropdown do usuário -->
        <div v-if="userMenuOpen" class="user-dropdown">
          <div class="user-info-dropdown">
            <strong>{{ currentUser?.name }}</strong>
            <small>{{ currentUser?.email }}</small>
          </div>
          <div class="dropdown-divider"></div>
          <button @click="handleLogout" class="logout-dropdown-btn">
            🚪 Sair do sistema
          </button>
        </div>
      </div>
      <div style="position: relative;">
        <button class="menu-hamburger" @click="toggleSidebar">☰</button>

        <div class="top-menu">
          <div class="menu-item" :class="{ active: activeTab === 'chats' }" @click="activeTab = 'chats'">💬 Chats</div>
          <div class="menu-item" :class="{ active: activeTab === 'configuracoes' }"
            @click="activeTab = 'configuracoes'">
            ⚙️ Configurações</div>
          <button class="broadcast-btn" @click="openBroadcastModal">📢</button>
        </div>
      </div>

      <!-- Conteudo -->
      <div class="main-content">
        <!-- Aba CHATS -->
        <div class="tab-chats" :class="{ hidden: activeTab !== 'chats' }">
          <!-- Sidebar -->
          <div class="sidebar" :class="{ open: sidebarOpen }">
            <div class="sidebar-header">
              <h2>💬 Tickets</h2>
              <p>Selecione uma conversa</p>
            </div>
            <div class="search-box"><input type="text" v-model="searchTerm" name="search-box"
                placeholder="🔍 Buscar ticket..." @input="updateSearchTerm"></div>

            <div class="filter-switch">
              <label class="switch-label">
                <span>Mostrar apenas fechados</span>
                <div class="switch">
                  <input type="checkbox" v-model="showOnlyClosed" @change="filterTickets">
                  <span class="slider"></span>
                </div>
              </label>
            </div>

            <!-- lista dos tickets -->
            <div class="tickets-list">
              <div v-if="loadingTickets" class="loading-state">
                <div class="spinner"></div>Carregando...
              </div>
              <template v-if="!loadingTickets">
                <div v-if="filteredTickets.length === 0" class="empty-state">📭 Nenhum ticket
                </div>
                <div v-for="ticket in filteredTickets" :key="ticket.id" class="ticket-item" :data-ticket="ticket.id"
                  :class="{ active: currentTicket?.id === ticket.id , updated: updatedTickets[ticket.id] }"
                  @click="selectTicket(ticket.id)">
                  <div class="ticket-avatar">{{ getTicketAvatar(ticket) }}
                    <span class="channel-badge">{{ getChannelIconByTicket(ticket) }}</span>
                  </div>
                  <div class="ticket-info">
                    <div class="ticket-name">
                      <span>{{ ticket.owner || ticket.name || `Ticket ${ticket.id}` }}</span>
                      <span class="ticket-time">{{ formatTime(ticket.lastMessageAt) }}</span>
                    </div>
                    <div class="ticket-preview">{{ (ticket.lastMessage || 'Nenhuma mensagem').substring(0,50) }}</div>
                    <span class="status-badge" :class="ticket.status">{{ getStatusText(ticket.status) }}</span>
                  </div>
                  <div class="ticket-actions">
                    <button class="action-btn attend" @click.stop="attendTicket(ticket.id)">🎧</button>
                    <button class="action-btn close" @click.stop="closeTicket(ticket.id)">✅</button>
                    <button class="action-btn reopen" @click.stop="reopenTicket(ticket.id)">🔄</button>
                  </div>
                </div>
              </template>
            </div>
          </div>

          <!-- Conteudo dos tickets -->
          <div class="chat-container" id="chat-container">
            <div class="chat-header">
              <div>
                <h2>{{ currentTicket ? `Ticket #${currentTicket.id}` : 'Ticket #' }}</h2>
              </div>
              <div class="connection-status" :class="{ connected: socketConnected, disconnected: !socketConnected }">
                {{ socketConnected ? '🟢 Conectado' : '🔴 Desconectado' }}
              </div>
            </div>

            <!-- Message area Box com mensagens -->
            <div class="messages-area" ref="messagesArea" id="messages-area">
              <div v-if="loadingMessages" class="loading-state">
                <div class="spinner"></div>Carregando...
              </div>

              <div v-else-if="currentMessages.length === 0" class="empty-state">💬 Nenhuma mensagem ainda</div>
              <div v-for="msg in currentMessages" :key="msg.id" class="message-wrapper" :data-message-id="msg.id"
                :class="msg.fromMe ? 'sent' : 'received'">
                <div class="message-bubble">
                  <!-- Mensagem apagada -->
                  <div v-if="msg.isDeleted" style="font-style: italic; color: #667781;">
                    Mensagem apagada
                  </div>

                  <!-- Conteúdo normal (não apagado) -->
                  <div v-else>
                    <!-- IMAGEM -->
                    <template v-if="['image', 'jpg', 'image/jpeg', 'png', 'imageMessage'].includes(msg.mediaType)">
                      <img :src="getMediaUrl(msg.mediaUrl)" crossorigin="anonymous" alt="Imagem"
                        style="max-width: 250px; max-height: 250px; border-radius: 6px; cursor: pointer;"
                        @click="openInNewTab(getMediaUrl(msg.mediaUrl))" />
                      <div v-if="msg.body" style="margin-top: 6px;" v-html="formatMessage(msg.body)"></div>
                    </template>

                    <!-- VÍDEO -->
                    <template v-else-if="['video', 'videoMessage'].includes(msg.mediaType)">
                      <video controls style="max-width: 250px; border-radius: 6px;">
                        <source :src="getMediaUrl(msg.mediaUrl)">
                      </video>
                      <div v-if="msg.body" style="margin-top: 6px;" v-html="formatMessage(msg.body)"></div>
                    </template>

                    <!-- ÁUDIO -->
                    <template v-else-if="['audio', 'audioMessage'].includes(msg.mediaType)">
                      <audio controls style="width: 250px;">
                        <source :src="getMediaUrl(msg.mediaUrl)">
                      </audio>
                      <div v-if="msg.body" style="margin-top: 6px;" v-html="formatMessage(msg.body)"></div>
                    </template>

                    <!-- DOCUMENTO -->
                    <template v-else-if="['document', 'txt', 'documentMessage'].includes(msg.mediaType)">
                      <div
                        style="display: flex; align-items: center; gap: 10px; background: #f0f2f5; padding: 10px; border-radius: 8px;">
                        <div style="font-size: 30px;">📄</div>
                        <div style="flex: 1;">
                          <div style="font-weight: 500; font-size: 13px;">
                            {{ getFileName(msg.body) }}
                          </div>
                          <div style="font-size: 11px; color: #667781;">
                            {{ getFileExtension(msg.body) }}
                          </div>
                        </div>
                        <button @click="openInNewTab(getMediaUrl(msg.mediaUrl))"
                          style="background: #075e54; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">
                          Baixar
                        </button>
                      </div>
                      <div v-if="msg.body && !isDocumentWithoutCaption(msg.mediaType)" style="margin-top: 6px;"
                        v-html="formatMessage(msg.body)"></div>
                    </template>

                    <!-- TEXTO PURO (fallback) -->
                    <div v-else v-html="formatMessage(msg.body)"></div>
                  </div>
                  <div class="message-footer">

                    <span>{{ formatTime(msg.createdAt) }}</span>
                    <span v-if="msg.fromMe" class="msg-status">
                      <span v-if="msg.ack !== 1">✓✓</span>
                      <span v-else-if="msg.ack === 1">✓</span>
                      <!-- <span v-else-if="msg.ack === 0" class="pending">⏱️</span> -->
                    </span>
                  </div>
                </div>
              </div>
              <template v-for="message in tempMessages" :key="message.id" v-if="tempMessages.length">

                <div class="message-wrapper sent" :data-temp="message.id">
                  <div class="message-bubble" style="opacity: 0.7;">
                    <div class="message-body">
                      <div v-html="formatMessage(message.body)"></div>
                      <!-- ${message.mediaUrl ? `<div style="margin-top: 5px;"><img src="${message.mediaUrl}"
                          style="max-width: 150px; border-radius: 4px;"></div>` : ''} -->
                    </div>
                    <div class="message-footer">
                      <span>⏳ Enviando...</span>
                    </div>
                  </div>
                </div>
              </template>
            </div>

            <!-- PRÉ-VISUALIZAÇÃO DE ARQUIVOS -->
            <div v-if="selectedFiles.length" class="file-preview">
              <div v-for="(fileItem, idx) in selectedFiles" :key="idx" class="file-preview-item">
                <img v-if="fileItem.preview" :src="fileItem.preview" class="preview-thumb">
                <div v-else class="file-icon">{{ getFileIcon(fileItem.type) }}</div>
                <div class="file-info">
                  <div class="file-name">{{ fileItem.name.substring(0, 30) }}</div>
                  <div class="file-size">{{ (fileItem.size / 1024).toFixed(1) }} KB</div>
                  <input type="text" class="file-caption" v-model="fileItem.caption" placeholder="Adicionar legenda...">
                </div>
                <button class="file-preview-remove" @click="removeFile(idx)">✕</button>
              </div>
              <button class="file-preview-send" @click="sendFiles"> Enviar {{ selectedFiles.length }}
                arquivo(s)</button>
            </div>

            <!-- Footer Input -->
            <div class="chat-footer">
              <button class="attach-btn" :disabled="!currentTicket" @click="triggerFileInput">📎</button>
              <input type="file" ref="fileInput" style="display:none" multiple @change="handleFileSelect">
              <textarea id="message-input" class="message-input" v-model="newMessageText"
                :disabled="!currentTicket || selectedFiles.length" placeholder="Digite uma mensagem..."
                @keypress.enter.prevent="sendMessage"></textarea>
              <button class="send-btn" :disabled="!currentTicket || !newMessageText.trim()" @click="sendMessage">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                </svg>
              </button>
            </div>
          </div>
        </div>

        <!-- ABA CONFIGURACOES -->
        <div class="tab-configuracoes" :class="{ hidden: activeTab !== 'configuracoes' }">
          <div class="config-container">
            <div class="config-sidebar">
              <div class="config-sidebar-item" :class="{ active: configSubtab === 'users' }"
                @click="configSubtab = 'users'">👥 Usuários</div>
              <div class="config-sidebar-item" :class="{ active: configSubtab === 'channels' }"
                @click="configSubtab = 'channels'">🔌 Canais</div>
            </div>
            <div class="config-content">
              <div v-if="configSubtab === 'users'">
                <div class="users-header">
                  <h2>👥 Gerenciar Usuários</h2>
                  <button class="btn-primary" v-if="isAdmin" @click="openUserModal">➕ Novo Usuário</button>
                </div>
                <div v-if="loadingUsers" class="loading-state">
                  <div class="spinner"></div>
                </div>
                <div v-else-if="users.length === 0" class="empty-state">📭 Nenhum usuário</div>
                <table v-else class="users-table">
                  <thead>
                    <tr>
                      <th>Nome</th>
                      <th>Email</th>
                      <th>Perfil</th>
                      <th>Status</th>
                      <th>Ações</th>
                    </tr>
                  </thead>
                  <tbody>

                    <tr v-for="user in filteredUsers" :key="user.id">
                      <td>{{ user.name }}</td>
                      <td>{{ user.email }}</td>
                      <td>{{ user.role === 'administrador' ? 'Admin' : 'Atendente' }}</td>
                      <td>{{ user.isActive === true ? '🟢 Ativo' : '🔴 Inativo' }}</td>
                      <td class="action-icons">
                        <button @click="editUser(user)">✏️</button>
                        <button @click="deleteUser(user.id)">🗑️</button>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <div v-if="configSubtab === 'channels'">
                <div class="users-header">
                  <h2>🔌 Canais de Conexão</h2>
                  <button class="btn-primary" v-if="isAdmin" @click="openAddChannelModal">➕ Adicionar Canal</button>
                </div>
                <div v-if="loadingChannels" class="loading-state">
                  <div class="spinner"></div>
                </div>
                <div v-else-if="channels.length === 0" class="empty-state">📭 Nenhum canal</div>
                <div class="channels-grid">
                  <div v-for="ch in channels" :key="ch.id" class="channel-card">
                    <div class="channel-header">
                      <span class="channel-icon">{{ ch.type === 'whatsapp' ? '📱' : '✈️' }}</span>
                      <span class="status-badge" :class="ch.status === 'CONNECTED' ? 'open' : 'pending'">
                        {{ ch.status === 'CONNECTED' ? 'Conectado' : 'Desconectado' }}
                      </span>
                    </div>
                    <div class="channel-name">{{ ch.name }}</div>
                    <div class="channel-actions">
                      <button v-if="ch.status === 'CONNECTED'" class="channel-btn disconnect"
                        @click="disconnectChannel(ch.id)">Desconectar</button>
                      <button v-else class="channel-btn connect" @click="connectChannel(ch.id)">Conectar</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ===================== MODAIS (dentro do #app) ===================== -->

      <!-- Modal Mensagem Avulsa -->
      <div id="broadcastModal" class="broadcast-modal" :class="{ active: broadcastModalVisible }">
        <div class="modal-content">
          <div class="modal-header">
            <h3>📢 Enviar Mensagem Avulsa</h3>
            <button class="modal-close" @click="broadcastModalVisible = false">&times;</button>
          </div>
          <div class="modal-body">
            <div class="form-group">
              <label>Canal</label>
              <select v-model="broadcastChannelId">
                <option value="">Selecione</option>
                <option v-for="ch in channels.filter(ch => ch.status === 'CONNECTED')" :key="ch.id" :value="ch.id">
                  {{ ch.name }}
                </option>
              </select>
            </div>
            <div class="form-group">
              <label>Número</label>
              <input v-model="broadcastNumber" placeholder="31999999999"
                @input="broadcastNumber = broadcastNumber.replace(/\D/g, '')">
            </div>
            <div class="form-group">
              <label>Mensagem</label>
              <textarea v-model="broadcastMessage" rows="3"></textarea>
            </div>
            <div class="form-group">
              <label>Anexos</label>
              <div class="broadcast-attach">
                <input type="file" ref="broadcastFileInput" style="display:none" @change="handleBroadcastFileSelect"
                  accept="image/*,video/*,audio/*,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain">
                <button @click="triggerBroadcastFile" class="insert">📎</button>
                <span id="broadcastFileName">Nenhum arquivo selecionado</span>
              </div>
              <div v-if="broadcastFileName" class="broadcast-file-preview">
                {{ broadcastFileName }} <button @click="removeBroadcastFile">✕</button>
              </div>
            </div>
            <button class="broadcast-send-btn" @click="sendBroadcastMessage"
              :disabled="sendingBroadcast">Enviar</button>
          </div>
        </div>
      </div>

      <!-- Modal Adicionar Canal -->
      <div id="channelModal" class="modal" :class="{ active: channelModalVisible }">
        <div class="modal-content">
          <div class="modal-header">
            <h3>Adicionar Canal</h3>
            <button class="modal-close" @click="channelModalVisible = false">&times;</button>
          </div>
          <div class="modal-body">
            <div class="form-group">
              <label>Tipo - {{selectedChannelType}}</label>
              <div class="channel-options">

                <div class="channel-option" data-channel-type="whatsapp" @click="selectChannelType('whatsapp')"
                  :class="['channel-option', { selected: selectedChannelType === 'whatsapp' }]">
                  <div class="channel-option-icon">📱</div>
                  <div class="channel-option-title">WhatsApp Web</div>
                  <div class="channel-option-desc">Conexão via QR Code</div>
                </div>
                <div class="channel-option" data-channel-type="wpp-business" @click="selectChannelType('wpp-business')"
                  :class="['channel-option', { selected: selectedChannelType === 'wpp-business' }]">
                  <div class="channel-option-icon">💼</div>
                  <div class="channel-option-title">WhatsApp Business</div>
                  <div class="channel-option-desc">API Oficial</div>
                </div>
                <div class="channel-option" data-channel-type="telegram" @click="selectChannelType('telegram')"
                  :class="['channel-option', { selected: selectedChannelType === 'telegram' }]">
                  <div class="channel-option-icon">✈️</div>
                  <div class="channel-option-title">Telegram</div>
                  <div class="channel-option-desc">Bot API</div>
                </div>
              </div>
              <!-- <select v-model="selectedChannelType">
              <option value="">Selecione</option>
              <option value="whatsapp">WhatsApp Web</option>
              <option value="telegram">Telegram</option>
            </select> -->
            </div>
            <div class="form-group">
              <label>Nome</label>
              <input v-model="newChannelName" placeholder="Nome do canal">
            </div>
            <div id="telegramFields" class="dynamic-fields"
              :class="['dynamic-fields', { active: selectedChannelType === 'telegram' }]">
              <div class="form-group">
                <label>Token do Bot *</label>
                <input type="text" id="botToken" placeholder="Ex: 1234567890:ABCdefGHIjklmNOPqrstUvWXyz"
                  autocomplete="off">
                <small style="color: #667781; font-size: 11px;">Crie um bot no @BotFather do Telegram</small>
              </div>
            </div>
            <div id="wppWebFields" class="dynamic-fields"
              :class="['dynamic-fields', { active: selectedChannelType === 'whatsapp' }]">
              <div class="form-group">
                <label>Número do WhatsApp *</label>
                <input type="text" id="whatsappNumber" placeholder="Ex: 11999999999" autocomplete="off">
                <small style="color: #667781; font-size: 11px;">Digite o número com DDD e país</small>
              </div>
            </div>
            <div id="wppBusinessFields" class="dynamic-fields"
              :class="['dynamic-fields', { active: selectedChannelType === 'wpp-business' }]">
              <div class="form-group">
                <label>Phone Number ID *</label>
                <input type="text" id="phoneNumberId" placeholder="ID do número de telefone" autocomplete="off">
              </div>
              <div class="form-group">
                <label>Access Token *</label>
                <input type="text" id="accessToken" placeholder="Token de acesso da API" autocomplete="off">
              </div>
              <div class="form-group">
                <label>Business Account ID</label>
                <input type="text" id="businessAccountId" placeholder="ID da conta business (opcional)"
                  autocomplete="off">
              </div>
            </div>
            <!-- <div v-if="selectedChannelType === 'telegram'" class="form-group">
            <label>Token Bot</label>
            <input v-model="newChannelToken" placeholder="Token do BotFather">
          </div>
          <div v-if="selectedChannelType === 'whatsapp'" class="form-group">
            <label>Número</label>
            <input v-model="newChannelNumber" placeholder="5511999999999">
          </div> -->


            <div class="modal-buttons">
              <button class="btn-secondary" @click="channelModalVisible = false">Cancelar</button>
              <button class="btn-primary" @click="createChannel">Criar</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Modal Usuário (CRIADO — estava faltando) -->
      <div id="userModal" class="modal" :class="{ active: userModalVisible }">
        <div class="modal-content">
          <div class="modal-header">
            <h3>{{ editingUser.id ? 'Editar' : 'Adicionar' }} Usuário</h3><button class="modal-close"
              @click="userModalVisible = false">&times;</button>
          </div>
          <div class="modal-body">
            <div class="form-group"><label>Nome</label><input v-model="editingUser.name" placeholder="Nome"></div>
            <div class="form-group"><label>Email</label><input v-model="editingUser.email" type="email"></div>
            <div class="form-group"><label>Senha</label><input v-model="editingUser.passwordHash" type="password"></div>
            <div class="form-group" v-if="isAdmin">
              <label>Perfil</label>
              <select v-model="editingUser.role">
                <option value="atendente">Atendente</option>
                <option value="administrador">Admin</option>
              </select>
            </div>
            <div class="form-group" v-if="isAdmin">
              <label>Status</label>
              <select v-model="editingUser.isActive">
                <option :value="true">Ativo</option>
                <option :value="false">Inativo</option>
              </select>
            </div>
            <div class="modal-buttons"><button class="btn-secondary"
                @click="userModalVisible = false">Cancelar</button><button class="btn-primary"
                @click="saveUser">Salvar</button></div>
          </div>
        </div>
      </div>
    </template>
    <template v-else>
      <div style="display: flex; justify-content: center; align-items: center; height: 100vh;">
        <div>Verificando autenticação...</div>
      </div>
    </template>

  </div>
  <!-- fim #app -->



  <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
  <script>
    const { createApp, ref, computed, onMounted, nextTick, watch } = Vue;
    createApp({
      setup() {
        const URL_BASE = "http://localhost:3000";
        let socket = null;
        // Estado
        const activeTab = ref('chats');
        const updatedTickets = ref({});
        const socketConnected = ref(false);
        const sidebarOpen = ref(false);
        const messageAreaRef = ref(null)
        const broadcastFileInput = ref(null)
        const configSubtab = ref('users');
        const isAuthenticated = ref(false)
        const currentUser = ref(null);
        const userMenuOpen = ref(false);

        // Tickets
        const allTickets = ref([]);
        const searchTerm = ref('');
        const showOnlyClosed = ref(false);
        const currentTicket = ref(null);
        const currentMessages = ref([]);
        let tempMessages = ref([]);
        const loadingTickets = ref(false);
        const loadingMessages = ref(false);
        const newMessageText = ref('');

        // Usuários
        const users = ref([]);
        const loadingUsers = ref(false);
        const userModalVisible = ref(false);
        const editingUser = ref({ id: null, name: '', email: '', role: 'atendente', status: 'ativo' });

        // Canais
        const channels = ref([]);
        const loadingChannels = ref(false);
        const currentChannelId = ref(null);
        const qrcodeModalVisible = ref(false);

        // Modais
        const channelModalVisible = ref(false);
        const broadcastModalVisible = ref(false);
        const selectedChannelType = ref('');
        const newChannelName = ref('');
        const newChannelToken = ref('');
        const newChannelNumber = ref('');
        const broadcastChannelId = ref('');
        const broadcastNumber = ref('');
        const broadcastMessage = ref('');
        const broadcastSelectedFile = ref(null);
        const broadcastFileName = ref('');
        const sendingBroadcast = ref(false);


        // Arquivos
        const fileInput = ref(null);
        const selectedFiles = ref([]);
        const selectedBroadcastFiles = ref([]);


        // Computed
        const filteredTickets = computed(() => {
          let filtered = allTickets.value.filter(t => {
            const user =
              t.status === 'pending'
                ? true
                : t.userId === currentUser.value.id;

            const matchName = (t.owner || t.name || '').toLowerCase().includes(searchTerm.value.toLowerCase());
            const matchStatus = showOnlyClosed.value ? t.status === 'closed' : t.status !== 'closed';
            return matchName && matchStatus && user;
          });
          return filtered.sort((a, b) => (b.lastMessageAt || 0) - (a.lastMessageAt || 0));
        });
        const allMessages = computed(() => {
          const all = [...currentMessages.value];
          return all.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
        })
        const filteredUsers = computed(() => {
          if (currentUser.value.role === 'administrador') {
            return users.value;
          }

          return users.value.filter(
            user => user.id === currentUser.value.id
          );
        });
        const isAdmin = computed(() => {
          return currentUser.value.role === 'administrador';
        });
        //funcoes
        // === SOCKET.IO ===
        function initSocket() {
          if (socket && socketConnected) {
            console.log('Socket já conectado');
            return;
          }
          socket = io(URL_BASE, {
            transports: ['websocket', 'polling'], reconnection: true,
            reconnectionAttempts: 5,
            reconnectionDelay: 1000
          });
          socket.on('connect', () => {
            socketConnected.value = true
            console.log('✅ Socket conectado');
            connectionAttempts = 0;

            // document.getElementById('connection-status').textContent = '🟢 Socket Conectado';
            // document.getElementById('connection-status').className = 'connection-status connected';
          });
          socket.on('disconnect', () => {
            socketConnected.value = false
            // document.getElementById('connection-status').textContent = '🔴 Socket Desconectado';
            // document.getElementById('connection-status').className = 'connection-status disconnected';
          });
          socket.on('connect_error', (error) => {
            console.error('Erro de conexão:', error);
            connectionAttempts++;

            if (connectionAttempts >= 3) {
              console.warn('Múltiplas tentativas de conexão falharam. Verifique se o servidor Socket está rodando.');
            }
          });
          socket.on('new-message', async (message) => {
            console.log('Nova mensagem:', message);


            const ticketId = message.ticketid;
            const ticket = allTickets.value.find(t => t.id === ticketId);


            const ticketName = ticket?.owner || ticket?.name || `Ticket ${ticketId}`;

            if (!message.fromMe && message.fromMe !== true && message.fromMe !== 1 && message.fromMe !== 'true') {
              const messagePreview = message.body?.substring(0, 60) || "Nova mensagem";
              showNotification(
                `💬 Nova mensagem de ${ticketName}`,
                messagePreview,
                `msg-${message.id}`
              )
              scrool()
              // playNotificationSound()
            }
            if (ticket) {
              // CORREÇÃO: Adicionar a nova mensagem no início do array (mais recente primeiro)
              if (!ticket.messages) ticket.messages = [];
              ticket.messages.unshift(message); // unshift adiciona no início

              // Atualizar última mensagem
              ticket.lastMessage = message.body;
              ticket.lastMessageAt = message.createdAt;
            }

            if (currentTicket.value.id === message.ticketid) await loadMessages(currentTicket.value.id);
            // await loadTickets();


          });
          // Evento: ticket atualizado (SUBSTITUA O EXISTENTE)
          socket.on('ticket-updated', async (data) => {
            console.log('🔄 Ticket atualizado:', data);
            // NOTIFICAÇÃO: Ticket mudou para status pendente
            if (data.status === 'pending' && data.previousStatus !== 'pending') {
              const ticketName = data.owner || data.name || `Ticket ${data.id}`;
              showNotification(
                `🆕 Novo ticket pendente`,
                `${ticketName} aguarda atendimento`,
                `ticket-${data.id}-pending`
              );
              // playNotificationSound()
            }
            updateSingleTicket(data)
            // await loadTickets();
          });
          socket.on('channel-update', (data) => {
            console.log('Channel update:', data);
            if (currentChannelId && currentChannelId === (data.channelId || data.id)) {
              if (data.status === 'qrcode' && data.qrcode) showQRCode(data.qrcode);
              if (data.pairingCode) showPairingCode(data.pairingCode);
              if (data.status === 'CONNECTED') {
                updateQRCodeStatus('connected', '✅ Conectado!');
                setTimeout(() => { closeQRCodeModal(); loadChannels(); }, 2000);
              }
            }
          });
        }
        const toggleUserMenu = () => {
          userMenuOpen.value = !userMenuOpen.value;
        };

        // Fechar menu ao clicar fora
        const closeUserMenu = () => {
          userMenuOpen.value = false;
        };

        // Função para verificar token
        const checkAuthentication = () => {
          const token = localStorage.getItem('auth_token');
          const userData = localStorage.getItem('user_data');
          if (!token || !userData) {
            redirectToLogin();
            return false;
          }
          // Verificar se token expirou
          try {
            const payload = JSON.parse(atob(token.split('.')[1]));

            if (payload.exp < Date.now() / 1000) {
              clearSession();
              redirectToLogin();
              return false;
            }
            const parsedUserData = JSON.parse(userData);
            parsedUserData.role = payload.profile;
            currentUser.value = parsedUserData;
            isAuthenticated.value = true;
            return true;
          } catch (error) {
            clearSession();
            redirectToLogin();
            return false
          }


        }

        // Limpar sessão
        const clearSession = () => {
          localStorage.removeItem('auth_token');
          localStorage.removeItem('user_data');
        };
        // Logout
        const handleLogout = () => {
          clearSession();
          redirectToLogin();
        };
        // Redirecionar para login
        const redirectToLogin = () => {
          window.location.href = 'login.html';
        };


        const getMediaUrl = (mediaUrl) => (`${URL_BASE}/public/${mediaUrl}`)

        const openInNewTab = (url) => (window.open(url, '_blank'))
        const getFileName = (body) => {
          if (!body) return 'Documento';
          // Se o body já for o nome do arquivo, retorna ele mesmo
          // Se vier com path, extraia o nome: body.split('/').pop()
          return body.length > 40 ? body.substring(0, 40) + '...' : body;
        }
        const getFileExtension = (body) => {
          if (!body) return '';
          const ext = body.split('.').pop();
          return ext ? ext.toUpperCase() : '';
        }
        const isDocumentWithoutCaption = (mediaType) => {
          // Se a lógica original era evitar repetir o body quando ele já é o nome do arquivo
          return ['txt', 'document'].includes(mediaType);
        }
        async function requestNotificationPermission() {
          if (!("Notification" in window)) {
            console.log("Este navegador não suporta notificações");
            return false;
          }

          if (Notification.permission === "granted") {
            return true;
          }

          if (Notification.permission !== "denied") {
            const permission = await Notification.requestPermission();
            return permission === "granted";
          }

          return false;
        }
        function showNotification(title, body, tag = null) {
          // Verifica se tem permissão
          if (Notification.permission !== "granted") {
            console.log("Permissão de notificação não concedida");
            return;
          }

          // Opções da notificação
          const options = {
            body: body,
            icon: "https://cdn-icons-png.flaticon.com/512/5968/5968841.png", // Ícone do WhatsApp
            badge: "https://cdn-icons-png.flaticon.com/512/5968/5968841.png",
            tag: tag || "ticket-notification", // Evita notificações duplicadas
            requireInteraction: false, // Muda para true se quiser que fique até o usuário clicar
            silent: false,
            vibrate: [200, 100, 200] // Vibração (funciona em dispositivos móveis)
          };

          // Cria e mostra a notificação
          const notification = new Notification(title, options);

          // Fecha automaticamente após 5 segundos
          setTimeout(() => notification.close(), 5000);

          // Ao clicar na notificação, foca na janela/aba
          notification.onclick = function () {
            window.focus();
            notification.close();
          };
        }
        async function attendTicket(id) {
          updatedTickets.value[id] = true;
          await updateTicketStatus(id, 'open', '🎧 Ticket em atendimento');
        }
        async function closeTicket(id) {
          if (confirm('Finalizar ticket?'))
            updatedTickets.value[id] = true;
          await updateTicketStatus(id, 'closed', '✅ Ticket finalizado');
        }
        async function reopenTicket(id) {
          updatedTickets.value[id] = true;
          await updateTicketStatus(id, 'pending', '🔄 Ticket reaberto');
        }
        async function updateTicketStatus(id, status, msg) {
          try {
            const dataForUpdate = {
              ...currentUser.value,
              status
            }
            const response = await fetch(`${URL_BASE}/api/v1/tickets/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(dataForUpdate) });
            showNotification('Atualização de Ticket',
              msg);
            if (response.ok) {
              const data = await response.json()
              updateSingleTicket(data)
              updatedTickets.value[id] = false;
            }
            // await loadTickets();
            if (currentTicket?.id === id) await loadMessages(id);
          } catch (error) { showNotification('Erro ao atualizar ticket', 'error'); }
        }

        const getFileIcon = (type) => {
          if (type.includes('pdf')) return '📄';
          if (type.includes('video')) return '🎥';
          if (type.includes('audio')) return '🎵';
          return '📎';
        };
        function updateSearchTerm(event) {
          searchTerm.value = event.target.value;

        }
        function getStatusText(status) {
          const statusMap = {
            'pending': 'Pendente',
            'open': 'Em atendimento',
            'atendendo': 'Em atendimento',
            'closed': 'Finalizado'
          };
          return statusMap[status] || status;
        }

        }

            }

              size: file.size,
              type: file.type,

          try {
            // const res = await fetch(`${URL_BASE}/api/v1/messages/${currentTicket.value.id}`, {
            //   method: 'POST',

            // if (res.ok) {

            //   loadMessages(currentTicket.value.id);
            // } else {
            //   alert('Erro ao enviar arquivos');

          } catch (err) {
            console.error(err);
            alert('Erro de rede');
          }
        };
        const triggerBroadcastFile = () => {
          if (broadcastFileInput.value) {
            broadcastFileInput.value.click()
          }
        }

        const handleBroadcastFileSelect = (event) => {
          const files = Array.from(event.target.files);
          if (files.length === 0) return;

          for (const file of files) {
            if (file.size > 25 * 1024 * 1024) {
              alert(`Arquivo ${file.name} excede 25MB`);
              continue;
            }
            broadcastFileName.value = file.name
            // Gerar preview local para imagens
            let preview = null;
            if (file.type.startsWith('image/')) {
              preview = URL.createObjectURL(file);
            }
            selectedBroadcastFiles.value.push({
              file,
              name: file.name,
              size: file.size,
              type: file.type,
              preview,
              caption: ''
            });
          }
          // Limpar input para permitir re-seleção
          event.target.value = '';
        }
        const removeBroadcastFile = (index) => {
          const fileObj = selectedBroadcastFiles.value[index];
          selectedBroadcastFiles.value.splice(index, 1);
          broadcastFileName.value = ''
          // if (fileObj.preview) URL.revokeObjectURL(fileObj.preview);
        };
        const openBroadcastModal = () => {
          broadcastChannelId.value = '';
          broadcastNumber.value = '';
          broadcastMessage.value = '';
          broadcastSelectedFile.value = null;
          broadcastFileName.value = '';
          broadcastModalVisible.value = true;
        };
        function formatTime(dateString) {
          if (!dateString) return '';

          let date;
          if (typeof dateString === 'number' || /^\d+$/.test(dateString)) {
            date = new Date(parseInt(dateString));
          } else {
            date = new Date(dateString);
          }

          if (isNaN(date.getTime())) {
            return 'Data inválida';
          }

          const now = new Date();
          const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
          const msgDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());

          if (msgDate.getTime() === today.getTime()) {
            return date.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
          } else {
            return date.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }) +
              ' às ' + date.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
          }
        }
        const sendBroadcastMessage = () => { }
        const getTicketAvatar = (ticket) => (ticket.owner || ticket.name || '?').charAt(0).toUpperCase();
        const getChannelIconByTicket = (ticket) => { const ch = channels.value.find(c => c.id === ticket.channelId); return ch ? (ch.type === 'whatsapp' ? '📱' : '✈️') : '💬'; };
        const toggleSidebar = () => { sidebarOpen.value = !sidebarOpen.value; };
        const formatMessage = (text) => text ? text.replace(/\n/g, '<br>') : '';
        const loadChannels = async () => {
          loadingChannels.value = true;
          try { const res = await fetch(`${URL_BASE}/api/v1/channel`); channels.value = await res.json(); } catch (e) { console.error(e); }
          finally { loadingChannels.value = false; }
        };
        const loadTickets = async () => {
          loadingTickets.value = true;
          try {
            const res = await fetch(`${URL_BASE}/api/v1/tickets`);
            const data = await res.json();
            allTickets.value = (data.tickets || data || []).sort((a, b) => (b.lastMessageAt || 0) - (a.lastMessageAt || 0));
          } catch (e) { console.error(e); }
          finally { loadingTickets.value = false; }
        };
        const updateSingleTicket = (updatedTicket) => {
          // 1. Encontra o índice do ticket na lista atual
          const index = allTickets.value.findIndex(t => t.id === updatedTicket.id);

          if (index !== -1) {
            // 2. Se o ticket já existe, atualiza-o mesclando os dados antigos com os novos
            // Isso garante que você não perca propriedades locais que podem não vir no socket
            allTickets.value[index] = { ...allTickets.value[index], ...updatedTicket };
          } else {
            // 3. Se for um ticket novo (não estava na lista), adiciona-o
            allTickets.value.push(updatedTicket);
          }

          // 4. Reordena a lista, já que o 'lastMessageAt' mudou
          allTickets.value.sort((a, b) => (b.lastMessageAt || 0) - (a.lastMessageAt || 0));
        };
        const scrool = () => {
          const area = document.querySelector('.messages-area');
          if (area) {
            // Scroll imediato para o que já carregou
            area.scrollTop = area.scrollHeight;

            // Observador para ajustar o scroll conforme as imagens carregam
            const resizeObserver = new ResizeObserver(() => {
              area.scrollTop = area.scrollHeight;
            });

            // Observa a área de mensagens
            resizeObserver.observe(area);

            // Opcional: Desconectar após alguns segundos para não ficar rodando sempre
            setTimeout(() => resizeObserver.disconnect(), 3000);
          }
        }
        function loadMessages(ticketId) {
          tempMessages.value = []
          const ticket = allTickets.value.find(t => t.id === ticketId);
          if (ticket && ticket.messages) {
            // Ordenar mensagens por data (mais antigas primeiro para exibição)
            currentMessages.value = [...ticket.messages].sort((a, b) =>
              new Date(a.createdAt) - new Date(b.createdAt)
            );
          } else {
            currentMessages.value = [];
          }

          scrool();
        }


        const sendMessage = async () => {
          if (!currentTicket.value || !newMessageText.value.trim()) return;
          const text = newMessageText.value.trim()
          const tempId = 'temp_' + Date.now() + '_' + Math.random();

          try {
            const tempMessage = {
              id: tempId,
              body: text,
              fromMe: true,
              createdAt: new Date().toISOString(),
              ack: 0,
              mediaType: 'text',
              isDeleted: false,
              isForwarded: false,
              isTemp: true  // Marcar como temporária
            };
            // Adicionar mensagem temporária
            tempMessages.value.push(tempMessage);

            // Limpar input imediatamente
            newMessageText.value = '';
            await nextTick();
            scrool();
            // appendMessageOptimistic(tempMessage);
            const formData = new FormData();
            formData.append('body', text);
            formData.append('fromMe', 'true');
            const response = await fetch(`${URL_BASE}/api/v1/messages/${currentTicket.value.id}`, { method: 'POST', body: formData });



            // } else {
            //   // Se falhou, remover a mensagem temporária
            //   removeTempMessage(tempId);
            //   alert('Erro ao enviar mensagem');
            // }

            // loadMessages(currentTicket.value.id);


          } catch (e) {
            console.error(e); alert('Erro ao enviar');
            removeTempMessage(tempId);
          }
        };
        const selectTicket = async (ticketId) => {
          if (currentTicket.value?.id === ticketId) return;
          currentTicket.value = allTickets.value.find(t => t.id === ticketId);
          if (!currentTicket.value) return;
          loadingMessages.value = true;
          if (socket?.connected) socket.emit('join-ticket', ticketId);
          loadMessages(ticketId)
          loadingMessages.value = false;
          await nextTick();
          scrool()

        };
        const loadUsers = async () => {
          loadingUsers.value = true;
          try { const res = await fetch(`${URL_BASE}/api/v1/users`); users.value = await res.json(); } catch (e) { console.error(e); }
          finally { loadingUsers.value = false; }
        };
        const openUserModal = () => { editingUser.value = { id: null, name: '', email: '', role: 'atendente', status: 'ativo' }; userModalVisible.value = true; };
        const editUser = (user) => { editingUser.value = { ...user }; userModalVisible.value = true; };
        const saveUser = async () => {
          if (!editingUser.value.name || !editingUser.value.email) return alert('Preencha nome e email');
          const method = editingUser.value.id ? 'PUT' : 'POST';
          const url = editingUser.value.id ? `${URL_BASE}/api/v1/users/${editingUser.value.id}` : `${URL_BASE}/api/v1/users`;


          await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(editingUser.value) });
          userModalVisible.value = false;
          await loadUsers();
        };
        const deleteUser = async (id) => { if (confirm('Excluir?')) { await fetch(`${URL_BASE}/api/v1/users/${id}`, { method: 'DELETE' }); await loadUsers(); } };

        const openAddChannelModal = () => {

          selectedChannelType.value = '';
          newChannelName.value = '';
          newChannelToken.value = '';
          newChannelNumber.value = '';
          channelModalVisible.value = true;
        };
        const selectChannelType = (channel) => {
          selectedChannelType.value = channel
        }

        const createChannel = async () => {
          if (!selectedChannelType.value || !newChannelName.value) return alert('Preencha os campos');
          const data = { name: newChannelName.value, type: selectedChannelType.value };
          if (selectedChannelType.value === 'telegram') data.tokenTelegram = newChannelToken.value;
          if (selectedChannelType.value === 'whatsapp') { data.pairingCodeEnabled = true; data.wppUser = newChannelNumber.value; }
          await fetch(`${URL_BASE}/api/v1/channel`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
          channelModalVisible.value = false;
          await loadChannels();
        };
        onMounted(async () => {
          if (!checkAuthentication()) {
            return;
          }

          document.addEventListener('click', (e) => {
            if (!e.target.closest('.user-profile')) {
              userMenuOpen.value = false;
            }
          });
          // Pedir permissão na primeira interação do usuário
          const askOnce = async () => {
            const granted = await requestNotificationPermission();

            console.log('Permissão:', Notification.permission);
            console.log('Concedida?', granted);

            document.removeEventListener('click', askOnce);
          };

          document.addEventListener('click', askOnce);

          loadChannels();
          loadTickets();
          loadUsers();
          initSocket()
        });

        // Rolar sempre que adicionar nova mensagem
        watch(tempMessages, async () => {
          await nextTick() // Aguarda o Vue atualizar o DOM
          if (messageAreaRef.value) {
            messageAreaRef.value.scrollTop = messageAreaRef.value.scrollHeight
          }
        }, { deep: true })

        return {
          updatedTickets,
          isAuthenticated,
          users,
          configSubtab,
          broadcastFileInput,
          activeTab,
          tempMessages,
          messageAreaRef,
          loadingTickets,
          currentTicket,
          socketConnected,
          sidebarOpen,
          filteredTickets,
          newMessageText,
          currentMessages,
          fileInput,
          broadcastModalVisible,
          broadcastFileName,
          selectedFiles,
          searchTerm,
          showOnlyClosed,
          loadingMessages,
          broadcastChannelId,
          broadcastNumber,
          sendingBroadcast,
          showOnlyClosed,
          broadcastMessage,
          channels,
          loadingChannels,
          channelModalVisible,
          loadingUsers,
          selectedChannelType,
          newChannelName,
          userModalVisible,
          editingUser,
          editUser,
          createChannel,
          selectChannelType,
          openAddChannelModal,
          openUserModal,
          deleteUser,
          loadUsers,
          saveUser,
          removeBroadcastFile,
          sendBroadcastMessage,
          handleBroadcastFileSelect,
          getTicketAvatar,
          getChannelIconByTicket,
          toggleSidebar,
          sendMessage,
          selectTicket,
          loadChannels,
          formatTime,
          formatMessage,
          triggerFileInput,

          getStatusText,

          handleLogout,
          userMenuOpen,
          toggleUserMenu,
