<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ticket Manager - Vue</title>
  <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <title>Ticket Manager Vue - Chat e Configurações</title>
  <!--  Css-->
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <div class="app-container" id="app">
    <template v-if="isAuthenticated">

      <!-- Header com usuário e logout -->
      <div class="app-header">
        <div class="user-profile" @click="toggleUserMenu">
          <div class="user-name">{{ currentUser?.name }}</div>
          <span class="dropdown-arrow">▼</span>
        </div>

        <!-- Menu dropdown do usuário -->
        <div v-if="userMenuOpen" class="user-dropdown">
          <div class="user-info-dropdown">
            <strong>{{ currentUser?.name }}</strong>
            <small>{{ currentUser?.email }}</small>
          </div>
          <div class="dropdown-divider"></div>
          <button @click="handleLogout" class="logout-dropdown-btn">
            🚪 Sair do sistema
          </button>
        </div>
      </div>
      <div style="position: relative;">
        <button class="menu-hamburger" :class="{ activeHam: activeTab === 'chats' }" @click="toggleSidebar">☰</button>

        <div class="top-menu">
          <div class="menu-item" :class="{ active: activeTab === 'chats' }" @click="activeTab = 'chats'">💬 Chats</div>
          <div class="menu-item" :class="{ active: activeTab === 'configuracoes' }"
            @click="activeTab = 'configuracoes'">
            ⚙️ Configurações</div>
          <button class="broadcast-btn" @click="openBroadcastModal">📢</button>
        </div>
      </div>

      <!-- Conteudo -->
      <div class="main-content">
        <!-- Aba CHATS -->
        <div class="tab-chats" :class="{ hidden: activeTab !== 'chats' }">
          <!-- Sidebar -->
          <div class="sidebar" :class="{ open: sidebarOpen }">
            <div class="sidebar-header">
              <h2>💬 Tickets</h2>
              <p>Selecione uma conversa</p>
            </div>
            <div class="search-box"><input type="text" v-model="searchTerm" name="search-box"
                placeholder="🔍 Buscar ticket..." @input="updateSearchTerm"></div>

            <div class="filter-switch">
              <label class="switch-label">
                <label>Mostrar apenas fechados</label>
                <div class="switch">
                  <input type="checkbox" v-model="showOnlyClosed">
                  <span class="slider"></span>
                </div>
              </label>
            </div>

            <!-- lista dos tickets -->
            <div class="tickets-list">
              <div v-if="loadingTickets" class="loading-state">
                <div class="spinner"></div>Carregando...
              </div>
              <template v-if="!loadingTickets">
                <div v-if="filteredTickets.length === 0" class="empty-state">📭 Nenhum ticket
                </div>
                <div v-for="ticket in filteredTickets" :key="ticket.id" class="ticket-item" :data-ticket="ticket.id"
                  :class="{ active: currentTicket?.id === ticket.id , updated: updatedTickets[ticket.id] }"
                  @click="selectTicket(ticket.id)">
                  <div class="ticket-avatar">{{ getTicketAvatar(ticket) }}
                    <span class="channel-badge">{{ getChannelIconByTicket(ticket) }}</span>
                  </div>
                  <div class="ticket-info">
                    <div class="ticket-name">
                      <span>{{ ticket.owner || ticket.name || `Ticket ${ticket.id}` }}</span>
                      <span class="ticket-time">{{ formatTime(ticket.lastMessageAt) }}</span>
                    </div>
                    <div class="ticket-preview">{{ (ticket.lastMessage || 'Nenhuma mensagem').substring(0,50) }}</div>
                    <span class="status-badge" :class="ticket.status">{{ getStatusText(ticket.status) }}</span>
                  </div>
                  <div class="ticket-actions">
                    <button class="action-btn attend" @click.stop="attendTicket(ticket.id)">🎧</button>
                    <button class="action-btn close" @click.stop="closeTicket(ticket.id)">✅</button>
                    <button class="action-btn reopen" @click.stop="reopenTicket(ticket.id)">🔄</button>
                  </div>
                </div>
              </template>
            </div>
          </div>

          <!-- Conteudo dos tickets -->
          <div class="chat-container" id="chat-container">
            <div class="chat-header">
              <div>
                <h2>{{ currentTicket ? `Ticket #${currentTicket.id}` : 'Ticket #' }}</h2>
              </div>
              <div class="connection-status" :class="{ connected: socketConnected, disconnected: !socketConnected }">
                {{ socketConnected ? '🟢 Conectado' : '🔴 Desconectado' }}
              </div>
            </div>

            <!-- Message area Box com mensagens -->
            <div class="messages-area" ref="messageAreaRef" id="messages-area">
              <div v-if="loadingMessages" class="loading-state">
                <div class="spinner"></div>Carregando...
              </div>

              <div v-else-if="currentMessages.length === 0" class="empty-state">💬 Nenhuma mensagem ainda</div>
              <div v-for="msg in currentMessages" :key="msg.id" class="message-wrapper" :data-message-id="msg.id"
                :class="msg.fromMe ? 'sent' : 'received'">

                <div class="message-bubble">
                  <!-- Mensagem apagada -->
                  <div v-if="msg.isDeleted" style="font-style: italic; color: #667781;">
                    Mensagem apagada
                  </div>
                  <!-- Conteúdo normal (não apagado) -->



                  <div v-else>
                    <div v-show="msg.isGroupMsg" class="sender" v-html="msg.sender"></div>
                    <!-- IMAGEM -->
                    <template v-if="['image', 'jpg', 'image/jpeg', 'png', 'imageMessage'].includes(msg.mediaType)">
                      <img :src="getMediaUrl(msg.mediaUrl)" crossorigin="anonymous" alt="Imagem"
                        style="max-width: 250px; max-height: 250px; border-radius: 6px; cursor: pointer;"
                        @click="openInNewTab(getMediaUrl(msg.mediaUrl))" />
                      <div v-if="msg.body" style="margin-top: 6px;" v-html="formatMessage(msg.body)"></div>
                    </template>

                    <!-- VÍDEO -->
                    <template v-else-if="['video', 'videoMessage'].includes(msg.mediaType)">
                      <video controls style="max-width: 250px; border-radius: 6px;" crossorigin="anonymous">
                        <source :src="getMediaUrl(msg.mediaUrl)">
                      </video>
                      <div v-if="msg.body" style="margin-top: 6px;" v-html="formatMessage(msg.body)"></div>
                    </template>

                    <!-- ÁUDIO -->
                    <template v-else-if="['audio', 'audioMessage' ,'audio/ogg; codecs=opus'].includes(msg.mediaType)">
                      <audio controls style="width: 250px;" crossorigin="anonymous">
                        <source :src="getMediaUrl(msg.mediaUrl)">
                      </audio>
                      <div v-if="msg.body" style="margin-top: 6px;" v-html="formatMessage(msg.body)"></div>
                    </template>

                    <!-- DOCUMENTO -->
                    <template v-else-if="['document', 'txt', 'documentMessage'].includes(msg.mediaType)">
                      <div
                        style="display: flex; align-items: center; gap: 10px; background: #f0f2f5; padding: 10px; border-radius: 8px;">
                        <div style="font-size: 30px;">📄</div>
                        <div style="flex: 1;">
                          <div style="font-weight: 500; font-size: 13px;">
                            {{ getFileName(msg.body) }}
                          </div>
                          <div style="font-size: 11px; color: #667781;">
                            {{ getFileExtension(msg.body) }}
                          </div>
                        </div>
                        <button @click="openInNewTab(getMediaUrl(msg.mediaUrl))"
                          style="background: #075e54; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">
                          Baixar
                        </button>
                      </div>
                      <div v-if="msg.body && !isDocumentWithoutCaption(msg.mediaType)" style="margin-top: 6px;"
                        v-html="formatMessage(msg.body)"></div>
                    </template>

                    <!-- TEXTO PURO (fallback) -->
                    <div v-else v-html="formatMessage(msg.body)"></div>
                  </div>
                  <div class="message-footer">
                    <span>{{ formatTime(msg.createdAt) }}</span>
                    <span v-if="msg.fromMe" class="msg-status">
                      <span v-if="msg.ack !== 1">✓✓</span>
                      <span v-else-if="msg.ack === 1">✓</span>
                      <!-- <span v-else-if="msg.ack === 0" class="pending">⏱️</span> -->
                    </span>
                  </div>
                </div>
              </div>

              <template v-for="message in tempMessages" :key="message.id" v-if="tempMessages.length">

                <div class="message-wrapper sent" :data-temp="message.id">
                  <div class="message-bubble" style="opacity: 0.7;">
                    <div class="message-body">
                      <div v-html="formatMessage(message.body)"></div>
                      <!-- ${message.mediaUrl ? `<div style="margin-top: 5px;"><img src="${message.mediaUrl}"
                          style="max-width: 150px; border-radius: 4px;"></div>` : ''} -->
                    </div>
                    <div class="message-footer">
                      <span>⏳ Enviando...</span>
                    </div>
                  </div>
                </div>
              </template>
            </div>

            <!-- PRÉ-VISUALIZAÇÃO DE ARQUIVOS -->
            <div v-if="selectedFiles.length" class="file-preview">
              <div v-for="(fileItem, idx) in selectedFiles" :key="idx" class="file-preview-item">
                <img v-if="fileItem.preview" :src="fileItem.preview" class="preview-thumb">
                <div v-else class="file-icon">{{ getFileIcon(fileItem.type) }}</div>
                <div class="file-info">
                  <div class="file-name">{{ fileItem.name.substring(0, 30) }}</div>
                  <div class="file-size">{{ (fileItem.size / 1024).toFixed(1) }} KB</div>
                  <input type="text" class="file-caption" v-model="fileItem.caption" placeholder="Adicionar legenda...">
                </div>
                <button class="file-preview-remove" @click="removeFile(idx)">✕</button>
              </div>
              <button class="file-preview-send" @click="sendFiles"> Enviar {{ selectedFiles.length }}
                arquivo(s)</button>
            </div>

            <!-- Footer Input -->
            <div class="chat-footer">
              <button class="attach-btn" :disabled="!currentTicket" @click="triggerFileInput">📎</button>
              <input type="file" ref="fileInput" style="display:none" multiple @change="handleFileSelect">
              <textarea id="message-input" class="message-input" v-model="newMessageText"
                :disabled="!currentTicket || selectedFiles.length" placeholder="Digite uma mensagem..."
                @keypress.enter.prevent="sendMessage"></textarea>
              <button class="send-btn" :disabled="!currentTicket || !newMessageText.trim()" @click="sendMessage">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                </svg>
              </button>
            </div>
          </div>
        </div>

        <!-- ABA CONFIGURACOES -->

        <div class="tab-configuracoes" :class="{ hidden: activeTab !== 'configuracoes' }">
          <div class="config-container">
            <div class="config-sidebar">
              <div class="config-sidebar-item" :class="{ active: configSubtab === 'users' }"
                @click="configSubtab = 'users'">👥 Usuários</div>
              <div class="config-sidebar-item" :class="{ active: configSubtab === 'channels' }"
                @click="configSubtab = 'channels'">🔌 Canais</div>
            </div>
            <div class="config-content">
              <div v-if="configSubtab === 'users'">
                <div class="users-header">
                  <h2>👥 Gerenciar Usuários</h2>
                  <button class="btn-primary" v-if="isAdmin" @click="openUserModal">➕ Novo Usuário</button>
                </div>
                <div v-if="loadingUsers" class="loading-state">
                  <div class="spinner"></div>
                </div>
                <div v-else-if="users.length === 0" class="empty-state">📭 Nenhum usuário</div>
                <table v-else class="users-table">
                  <thead>
                    <tr>
                      <th>Nome</th>
                      <th>Email</th>
                      <th>Perfil</th>
                      <th>Status</th>
                      <th>Ações</th>
                    </tr>
                  </thead>
                  <tbody>

                    <tr v-for="user in filteredUsers" :key="user.id">
                      <td>{{ user.name }}</td>
                      <td>{{ user.email }}</td>
                      <td>{{ user.role === 'administrador' ? 'Admin' : 'Atendente' }}</td>
                      <td>{{ user.isActive === true ? '🟢 Ativo' : '🔴 Inativo' }}</td>
                      <td class="action-icons">
                        <button @click="editUser(user)">✏️</button>
                        <button @click="deleteUser(user.id)">🗑️</button>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <div v-if="configSubtab === 'channels'">
                <div class="users-header">
                  <h2>🔌 Canais de Conexão</h2>
                  <button class="btn-primary" v-if="isAdmin" @click="openAddChannelModal">➕ Adicionar Canal</button>
                </div>
                <div v-if="loadingChannels" class="loading-state">
                  <div class="spinner"></div>
                </div>
                <div v-else-if="channels.length === 0" class="empty-state">📭 Nenhum canal</div>
                <div class="channels-grid">
                  <div v-for="ch in channels" :key="ch.id" class="channel-card">
                    <div class="channel-header">
                      <span class="channel-icon">{{ ch.type === 'whatsapp' ? '📱' : '✈️' }}</span>
                      <span class="status-badge" :class="ch.status === 'CONNECTED' ? 'open' : 'pending'">
                        {{ ch.status === 'CONNECTED' ? 'Conectado' : 'Desconectado' }}
                      </span>
                    </div>
                    <div class="channel-name">{{ ch.name }}
                      <button @click="editChannel(ch)" v-if="isAdmin">✏️</button>
                    </div>
                    <div class="channel-actions" v-if="isAdmin">
                      <button v-if="ch.status === 'CONNECTED'" class="channel-btn disconnect"
                        @click="disconnectChannel(ch.id)">Desconectar</button>
                      <!-- <button v-if="ch.status === 'qrcode'" class="channel-btn" @click="openQRCodeModal">QrCode</button> -->
                      <button v-if="ch.status === 'CONNECTED' || ch.status === 'qrcode'" class="channel-btn refresh"
                        @click="refreshChannel(ch.id)">Reconectar</button>
                      <button v-else class="channel-btn connect" @click="connectChannel(ch.id)">Conectar</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ===================== MODAIS (dentro do #app) ===================== -->

      <!-- Modal QR Code -->
      <div v-if="qrCodeModalVisible" id="qrcodeModal" class="qrcode-modal">
        <div class="qrcode-content">
          <div class="qrcode-header">
            <h3>📱 Conectar WhatsApp</h3>
            <p>Escaneie o QR Code com seu WhatsApp</p>
          </div>
          <div class="qrcode-body">
            <div id="qrcodeContainer" class="qrcode-container">
              <div id="qrcodeImage" ref="qrCodeContainerRef" v-if="!isPairingCode">
                <div :class="['qrcode-loader', { none: isLoading}]" v-if="!qrcodeImage">
                </div>
                <div v-if="isLoading && qrString" style="color:red;">❌ QR Code vazio</div>
              </div>
              <div id="pairingContainer" v-if="isPairingCode">
                <div>Código de Pareamento</div>
                <div id="pairingCode">{{showPairingCode}}</div>
              </div>
            </div>
            <div id="qrcodeStatus" :class="['qrcode-status', statusClass]"> <span>
                {{ statusMessage }} </span>
            </div>


          </div>
          <div class="qrcode-close">
            <button @click="closeQRCodeModal">Fechar</button>
          </div>
        </div>
      </div>

      <!-- Modal Mensagem Avulsa -->
      <div id="broadcastModal" class="broadcast-modal" :class="{ active: broadcastModalVisible }">
        <div class="modal-content">
          <div class="modal-header">
            <h3>📢 Enviar Mensagem Avulsa</h3>
            <button class="modal-close" @click="broadcastModalVisible = false">&times;</button>
          </div>
          <div class="modal-body">
            <div class="form-group">
              <span>Canal</span>
              <select v-model="broadcastChannelId">
                <option value="">Selecione</option>
                <option v-for="ch in channels.filter(ch => ch.status === 'CONNECTED')" :key="ch.id" :value="ch.id">
                  {{ ch.name }}
                </option>
              </select>
            </div>
            <div class="form-group">
              <span>Número</span>
              <input v-model="broadcastNumber" placeholder="31999999999"
                @input="broadcastNumber = broadcastNumber.replace(/\D/g, '')">
            </div>
            <div class="form-group">
              <span>Mensagem</span>
              <textarea v-model="broadcastMessage" rows="3"></textarea>
            </div>
            <div class="form-group">
              <span>Anexos</span>
              <div class="broadcast-attach">
                <input type="file" ref="broadcastFileInput" style="display:none" @change="handleBroadcastFileSelect"
                  accept="image/*,video/*,audio/*,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain">
                <button @click="triggerBroadcastFile" class="insert">📎</button>
                <span id="broadcastFileName" v-if="!broadcastFileName">Nenhum arquivo selecionado</span>
              </div>
              <div v-if="broadcastFileName" class="broadcast-file-preview">
                {{ broadcastFileName }} <button @click="removeBroadcastFile">✕</button>
              </div>
            </div>
            <button class="broadcast-send-btn" @click="sendBroadcastMessage"
              :disabled="sendingBroadcast">Enviar</button>
          </div>
        </div>
      </div>

      <!-- Modal Adicionar Canal -->
      <div id="channelModal" class="modal" :class="{ active: channelModalVisible }">
        <div class="modal-content">
          <div class="modal-header">
            <h3>{{ editingChannel.id ? 'Editar Canal' : 'Adicionar Canal' }}</h3>
            <button class="modal-close" @click="channelModalVisible = false">&times;</button>
          </div>
          <div class="modal-body">
            <div class="form-group">
              <span>Tipo - {{selectedChannelType}}</span>
              <div class="channel-options">

                <div class="channel-option" data-channel-type="whatsapp" @click="selectChannelType('whatsapp')"
                  :class="['channel-option', { selected: selectedChannelType === 'whatsapp' }]">
                  <div class="channel-option-icon">📱</div>
                  <div class="channel-option-title">WhatsApp Web</div>
                  <div class="channel-option-desc">Conexão via QR Code</div>
                </div>
                <div class="channel-option" data-channel-type="wpp-business" @click="selectChannelType('wpp-business')"
                  :class="['channel-option', { selected: selectedChannelType === 'wpp-business' }]">
                  <div class="channel-option-icon">💼</div>
                  <div class="channel-option-title">WhatsApp Business</div>
                  <div class="channel-option-desc">API Oficial</div>
                </div>
                <div class="channel-option" data-channel-type="telegram" @click="selectChannelType('telegram')"
                  :class="['channel-option', { selected: selectedChannelType === 'telegram' }]">
                  <div class="channel-option-icon">✈️</div>
                  <div class="channel-option-title">Telegram</div>
                  <div class="channel-option-desc">Bot API</div>
                </div>
              </div>
              <!-- <select v-model="selectedChannelType">
              <option value="">Selecione</option>
              <option value="whatsapp">WhatsApp Web</option>
              <option value="telegram">Telegram</option>
            </select> -->
            </div>
            <div class="form-group">
              <span>Nome</span>
              <input v-model="newChannelName" placeholder="Nome do canal">
            </div>
            <div id="telegramFields" class="dynamic-fields"
              :class="['dynamic-fields', { active: selectedChannelType === 'telegram' }]">
              <div class="form-group">
                <span>Token do Bot *</span>
                <input type="text" id="botToken" placeholder="Ex: 1234567890:ABCdefGHIjklmNOPqrstUvWXyz"
                  autocomplete="off" v-model="newChannelToken">
                <small style="color: #667781; font-size: 11px;">Crie um bot no @BotFather do Telegram</small>
              </div>
            </div>
            <div id="wppWebFields" class="dynamic-fields"
              :class="['dynamic-fields', { active: selectedChannelType === 'whatsapp' }]">
              <div class="form-group">
                <span>Número do WhatsApp *</span>
                <input v-model="newChannelNumber" type="text" id="whatsappNumber" placeholder="Ex: 31999999999"
                  autocomplete="off">
                <small style="color: #667781; font-size: 11px;">Digite o número com DDD e país</small>
              </div>
            </div>
            <div id="wppBusinessFields" class="dynamic-fields"
              :class="['dynamic-fields', { active: selectedChannelType === 'wpp-business' }]">
              <div class="form-group">
                <span>Phone Number ID *</span>
                <input type="text" id="phoneNumberId" placeholder="ID do número de telefone" autocomplete="off"
                  v-model="phoneNumberId">
              </div>
              <div class="form-group">
                <span>Access Token *</span>
                <input type="text" id="accessToken" placeholder="Token de acesso da API" v-model="accessToken"
                  autocomplete="off">
              </div>
              <div class="form-group">
                <span>Business Account ID</span>
                <input type="text" id="businessAccountId" placeholder="ID da conta business (opcional)"
                  v-model="businessAccountId" autocomplete="off">
              </div>
            </div>
            <!-- <div v-if="selectedChannelType === 'telegram'" class="form-group">
            <span>Token Bot</span>
            <input v-model="newChannelToken" placeholder="Token do BotFather">
          </div>
          <div v-if="selectedChannelType === 'whatsapp'" class="form-group">
            <span>Número</span>
            <input v-model="newChannelNumber" placeholder="5511999999999">
          </div> -->


            <div class="modal-buttons">
              <button class="btn-secondary" @click="closeChannelModal">Cancelar</button>
              <button class="btn-primary" @click="createChannel">Criar</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Modal Usuário (CRIADO — estava faltando) -->
      <div id="userModal" class="modal" :class="{ active: userModalVisible }">
        <div class="modal-content">
          <div class="modal-header">
            <h3>{{ editingUser.id ? 'Editar' : 'Adicionar' }} Usuário</h3><button class="modal-close"
              @click="userModalVisible = false">&times;</button>
          </div>

          <div class="modal-body">
            <div class="form-group"><span>Nome</span><input id="nomeUsuario" v-model="editingUser.name"
                placeholder="Nome" /></div>
            <div class="form-group"><span>Email</span><input id="emailUsuario" v-model="editingUser.email" type="email">
            </div>
            <div class="form-group">
              <span>Senha</span>
              <input id="passwordUsuario" v-model="editingUser.passwordHash" type="password">
            </div>
            <div class="form-group" v-if="isAdmin">
              <span>Perfil</span>
              <select v-model="editingUser.role" id="selectPerfil">
                <option value="atendente">Atendente</option>
                <option value="administrador">Admin</option>
              </select>
            </div>
            <div class="form-group" v-if="isAdmin">
              <span>Status</span>
              <select v-model="editingUser.isActive" id="isActive">
                <option :value="true">Ativo</option>
                <option :value="false">Inativo</option>
              </select>
            </div>
            <div class="modal-buttons"><button class="btn-secondary"
                @click="userModalVisible = false">Cancelar</button><button class="btn-primary"
                @click="saveUser">Salvar</button></div>
          </div>
        </div>
      </div>
      <div class="alerta" :class="{ 'alerta-success': isSuccess, 'alerta-error': !isSuccess }" v-if="showAlerta">
        <span>{{alertaMessage}}</span>
      </div>
    </template>
    <template v-else>
      <div style="display: flex; justify-content: center; align-items: center; height: 100vh;">
        <div>Verificando autenticação...</div>
      </div>
    </template>

  </div>
