<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Login - Ticket Manager</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      background: white;
      border-radius: 10px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      width: 400px;
      padding: 40px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-header h2 {
      color: #333;
      margin-bottom: 10px;
    }

    .login-header p {
      color: #666;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 500;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-message {
      background: #fee;
      color: #c33;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 20px;
      text-align: center;
      font-size: 14px;
    }

    .info-message {
      background: #e3f2fd;
      color: #1976d2;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 20px;
      text-align: center;
      font-size: 14px;
    }

    .loading-container {
      text-align: center;
      padding: 40px;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <!-- Tela de loading enquanto valida token -->
    <div v-if="validating" class="login-container">
      <div class="loading-container">
        <div class="spinner"></div>
        <p>Validando sessão...</p>
      </div>
    </div>

    <!-- Tela de login (só aparece se não estiver autenticado) -->
    <div v-else class="login-container">
      <div class="login-header">
        <h2>🎫 Ticket Manager</h2>
        <p>Faça login para acessar o sistema</p>
      </div>

      <div v-if="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <div v-if="infoMessage" class="info-message">
        {{ infoMessage }}
      </div>

      <form @submit.prevent="handleLogin">
        <div class="form-group">
          <label>Email</label>
          <input type="email" v-model="credentials.email" required placeholder="seu@email.com" autocomplete="off">
        </div>

        <div class="form-group">
          <label>Senha</label>
          <input type="password" v-model="credentials.password" required placeholder="••••••" autocomplete="off">
        </div>

        <button type="submit" :disabled="loading">
          <span v-if="loading" class="loading-spinner"></span>
          {{ loading ? 'Entrando...' : 'Entrar' }}
        </button>
      </form>


    </div>
  </div>

  <script>
    const { createApp, ref, reactive, onMounted } = Vue;

    // Configuração do axios
    // axios.defaults.baseURL = 'http://localhost:3000/api/v1/auth';
    axios.defaults.baseURL = 'https://fast.panelapps.site/api/v1/auth';
    axios.defaults.timeout = 10000;

    createApp({
      setup() {
        // ==================== VARIÁVEIS REATIVAS ====================
        const credentials = reactive({
          email: '',
          password: ''
        });
        const loading = ref(false);
        const errorMessage = ref('');
        const infoMessage = ref('');
        const validating = ref(true); // Começa validando

        // ==================== FUNÇÕES DE VALIDAÇÃO ====================

        // Verificar se o token é válido (estrutura básica)
        const isTokenStructureValid = (token) => {
          try {
            if (!token || typeof token !== 'string') return false;
            const parts = token.split('.');
            if (parts.length !== 3) return false;

            // Tenta decodificar o payload
            const payload = JSON.parse(atob(parts[1]));
            return payload && typeof payload === 'object';
          } catch (error) {
            return false;
          }
        };

        // Verificar se o token expirou
        const isTokenExpired = (token) => {
          try {
            const payload = JSON.parse(atob(token.split('.')[1]));
            if (payload.exp) {
              return payload.exp < Date.now() / 1000;
            }
            return false;
          } catch {
            return true; // Se não conseguir decodificar, considera expirado
          }
        };

        // Validar token com o backend
        const validateTokenWithBackend = async (token) => {
          try {
            const response = await axios.post('/validate-token', { token });
            return response.data.valid === true;
          } catch (error) {
            console.error('Erro ao validar token:', error);
            return false;
          }
        };

        // Função principal de validação
        const validateExistingSession = async () => {
          const token = localStorage.getItem('auth_token');
          const userData = localStorage.getItem('user_data');

          // Caso 1: Não tem token ou dados do usuário
          if (!token || !userData) {
            console.log('Nenhuma sessão encontrada');
            validating.value = false;
            return false;
          }

          // Caso 2: Token com estrutura inválida
          if (!isTokenStructureValid(token)) {
            console.log('Token com estrutura inválida');
            clearSession();
            validating.value = false;
            return false;
          }

          // Caso 3: Token expirado
          if (isTokenExpired(token)) {
            console.log('Token expirado');
            clearSession();
            infoMessage.value = 'Sua sessão expirou. Faça login novamente.';
            setTimeout(() => { infoMessage.value = ''; }, 3000);
            validating.value = false;
            return false;
          }

          // Caso 4: Validar token com o backend (opcional, mas recomendado)
          try {
            const isValid = await validateTokenWithBackend(token);
            if (!isValid) {
              console.log('Token inválido no backend');
              clearSession();
              validating.value = false;
              return false;
            }
          } catch (error) {
            // Se o backend estiver offline, podemos optar por considerar válido
            // baseado apenas na estrutura e expiração (modo offline)
            console.warn('Backend offline, validando apenas estrutura local');
          }

          // Token válido! Redirecionar para o index
          console.log('Sessão válida encontrada, redirecionando...');
          infoMessage.value = 'Sessão válida encontrada. Redirecionando...';

          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1000);

          return true;
        };

        // Limpar sessão
        const clearSession = () => {
          localStorage.removeItem('auth_token');
          localStorage.removeItem('user_data');
        };

        // ==================== FUNÇÃO DE LOGIN ====================

        const handleLogin = async () => {
          if (!credentials.email || !credentials.password) {
            errorMessage.value = 'Preencha todos os campos';
            return;
          }

          loading.value = true;
          errorMessage.value = '';
          infoMessage.value = '';

          try {
            // Chamada para sua API
            const response = await axios.post('/login', {
              email: credentials.email,
              password: credentials.password
            });

            const { token, user } = response.data;

            // Salvar no localStorage
            localStorage.setItem('auth_token', token);
            localStorage.setItem('user_data', JSON.stringify(user));

            // Mensagem de sucesso
            infoMessage.value = 'Login realizado com sucesso! Redirecionando...';

            // Redirecionar
            setTimeout(() => {
              window.location.href = 'index.html';
            }, 1000);

          } catch (error) {

            if (error.response) {

              switch (error.response.status) {
                case 401:
                  errorMessage.value = 'Email ou senha incorretos';
                  break;
                case 403:
                  errorMessage.value = 'Email ou senha incorretos';
                  break;
                default:
                  errorMessage.value = error.response.data?.message ||
                    error.response.data?.error || 'Erro ao fazer login';
              }
            } else if (error.request) {
              errorMessage.value = 'Erro de conexão com o servidor';
            } else {
              errorMessage.value = 'Ocorreu um erro inesperado';
            }
          } finally {
            loading.value = false;
          }
        };

        // ==================== LIFECYCLE ====================
        onMounted(() => {
          // Validar sessão existente ao carregar a página
          validateExistingSession();
        });

        // ==================== RETORNO ====================
        return {
          credentials,
          loading,
          errorMessage,
          infoMessage,
          validating,
          handleLogin
        };
      }
    }).mount('#app');
  </script>
</body>

</html>
