<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Login - Ticket Manager</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0d0d0d 0%, #141414 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      background: #141414;
      border-radius: 10px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      width: 400px;
      padding: 40px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-header h2 {
      color: #a0a0a0;
      margin-bottom: 10px;
    }

    .login-header p {
      color: #666;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 500;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #2a2a2a;
    }

    button {
      width: 100%;
      padding: 12px;
      /* background: linear-gradient(135deg, #141414 0%, #1e1e1e 100%); */
      background: #1e1e1e;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s;
      transition: background 0.2s;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      background: #252525
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-message {
      background: #fee;
      color: #c33;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 20px;
      text-align: center;
      font-size: 14px;
    }

    .info-message {
      background: #e3f2fd;
      color: #1976d2;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 20px;
      text-align: center;
      font-size: 14px;
    }

    .loading-container {
      text-align: center;
      padding: 40px;
      color: #606060;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <!-- Tela de loading enquanto valida token -->
    <div v-if="validating" class="login-container">
      <div class="loading-container">
        <div class="spinner"></div>
        <p>Validando sessão...</p>
      </div>
    </div>

    <!-- Tela de login (só aparece se não estiver autenticado) -->
    <div v-else class="login-container">
      <div class="login-header">
        <h2>🎫 Ticket Manager</h2>
        <p>Faça login para acessar o sistema</p>
      </div>

      <div v-if="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <div v-if="infoMessage" class="info-message">
        {{ infoMessage }}
      </div>

      <form @submit.prevent="handleLogin">
        <div class="form-group">
          <label>Email</label>
          <input type="email" v-model="credentials.email" required placeholder="seu@email.com" autocomplete="off">
        </div>

        <div class="form-group">
          <label>Senha</label>
          <input type="password" v-model="credentials.password" required placeholder="••••••" autocomplete="off">
        </div>

        <button type="submit" :disabled="loading">
          <span v-if="loading" class="loading-spinner"></span>
          {{ loading ? 'Entrando...' : 'Entrar' }}
        </button>
      </form>
    </div>
  </div>

  <script>
    const { createApp, ref, reactive, onMounted } = Vue;

    // Configuração do axios
    axios.defaults.baseURL = 'http://localhost:3000/api/v1/auth';
    // axios.defaults.baseURL = 'https://nexus.devrenato.com.br/api/v1/auth';
    axios.defaults.timeout = 10000;

    createApp({
      setup() {
        // ==================== VARIÁVEIS REATIVAS ====================
        const credentials = reactive({
          email: '',
          password: ''
        });
        const loading = ref(false);
        const errorMessage = ref('');
        const infoMessage = ref('');
        const validating = ref(true);
        let validationCompleted = false; // Flag para evitar validação duplicada

        // ==================== FUNÇÕES DE VALIDAÇÃO ====================

        const isTokenStructureValid = (token) => {
          try {
            if (!token || typeof token !== 'string') return false;
            const parts = token.split('.');
            if (parts.length !== 3) return false;
            const payload = JSON.parse(atob(parts[1]));
            return payload && typeof payload === 'object';
          } catch (error) {
            return false;
          }
        };

        const isTokenExpired = (token) => {
          try {
            const payload = JSON.parse(atob(token.split('.')[1]));
            if (payload.exp) {
              // Adiciona margem de 5 segundos para evitar falsos positivos
              return payload.exp < (Date.now() / 1000) - 5;
            }
            return false;
          } catch {
            return true;
          }
        };

        const validateTokenWithBackend = async (token) => {
          try {
            const response = await axios.post('/validate-token', { token });
            console.log(response)
            return response.data.valid === true;
          } catch (error) {
            console.error('Erro ao validar token com backend:', error.message);
            // Se o backend estiver offline, considera o token válido baseado na estrutura
            return null; // Retorna null para indicar que não foi possível validar
          }
        };

        const clearSession = () => {
          localStorage.removeItem('auth_token');
          localStorage.removeItem('user_data');
        };

        const validateExistingSession = async () => {
          // Evita múltiplas execuções
          if (validationCompleted) return;

          const token = localStorage.getItem('auth_token');
          const userData = localStorage.getItem('user_data');

          // Caso 1: Não tem token ou dados do usuário
          if (!token || !userData) {
            console.log('Nenhuma sessão encontrada');
            validationCompleted = true;
            validating.value = false;
            return;
          }

          // Caso 2: Token com estrutura inválida
          if (!isTokenStructureValid(token)) {
            console.log('Token com estrutura inválida');
            clearSession();
            validationCompleted = true;
            validating.value = false;
            return;
          }

          // Caso 3: Token expirado
          if (isTokenExpired(token)) {
            console.log('Token expirado');
            clearSession();
            infoMessage.value = 'Sua sessão expirou. Faça login novamente.';
            setTimeout(() => { infoMessage.value = ''; }, 3000);
            validationCompleted = true;
            validating.value = false;
            return;
          }

          // Caso 4: Validar token com o backend (com timeout)
          try {
            // Adiciona timeout específico para validação
            const timeoutPromise = new Promise((_, reject) => {
              setTimeout(() => reject(new Error('Timeout na validação')), 5000);
            });

            const validatePromise = validateTokenWithBackend(token);
            const isValid = await Promise.race([validatePromise, timeoutPromise]);

            if (isValid === false) {
              console.log('Token inválido no backend');
              clearSession();
              validationCompleted = true;
              validating.value = false;
              return;
            }

            // isValid === true ou null (backend offline)
            console.log('Sessão válida, redirecionando...');
            infoMessage.value = 'Sessão válida encontrada. Redirecionando...';

            setTimeout(() => {
              window.location.href = 'index.html';
            }, 1000);

            return; // Não muda validating para false pois vai redirecionar

          } catch (error) {
            console.warn('Erro na validação com backend:', error.message);
            // Em caso de erro de rede, considera o token válido (modo offline)
            console.log('Modo offline: considerando token válido');
            infoMessage.value = 'Sessão válida encontrada. Redirecionando...';

            setTimeout(() => {
              window.location.href = 'index.html';
            }, 1000);
            return;
          }
        };

        // ==================== FUNÇÃO DE LOGIN ====================

        const handleLogin = async () => {
          if (!credentials.email || !credentials.password) {
            errorMessage.value = 'Preencha todos os campos';
            return;
          }

          loading.value = true;
          errorMessage.value = '';
          infoMessage.value = '';

          try {
            const response = await axios.post('/login', {
              email: credentials.email,
              password: credentials.password
            });

            const { token, user } = response.data;

            localStorage.setItem('auth_token', token);
            localStorage.setItem('user_data', JSON.stringify(user));

            infoMessage.value = 'Login realizado com sucesso! Redirecionando...';

            setTimeout(() => {
              window.location.href = 'index.html';
            }, 1000);

          } catch (error) {
            if (error.response) {
              switch (error.response.status) {
                case 401:
                case 403:
                  errorMessage.value = 'Email ou senha incorretos';
                  break;
                default:
                  errorMessage.value = error.response.data?.message ||
                    error.response.data?.error || 'Erro ao fazer login';
              }
            } else if (error.request) {
              errorMessage.value = 'Erro de conexão com o servidor';
            } else {
              errorMessage.value = 'Ocorreu um erro inesperado';
            }
          } finally {
            loading.value = false;
          }
        };

        // ==================== LIFECYCLE ====================
        onMounted(() => {
          validateExistingSession();
        });

        return {
          credentials,
          loading,
          errorMessage,
          infoMessage,
          validating,
          handleLogin
        };
      }
    })
      .mount('#app');
  </script>
</body>

</html>
