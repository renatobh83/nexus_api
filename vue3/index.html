<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ticket Manager - Vue</title>
  <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
  <link rel="stylesheet" href="./styles-dark.css" />
</head>

<body>
  <div class="app-container" id="app">
    <template v-if="isAuthenticated">

      <!-- Header -->
      <div class="app-header">
        <div class="connection-status">
          <div v-for="ch in channels.filter(ch => ch.type !== 'web')" :key="ch.id" class="channel"
            :class="{ connected: ch.status === 'CONNECTED', disconnected: ch.status === 'DISCONNECTED' }">
            {{ ch.type }}
          </div>
          <div :class="{ connected: socketConnected, disconnected: !socketConnected }">Socket</div>
        </div>
        <div class="user-profile" @click="toggleUserMenu">
          <div class="user-name">{{ currentUser?.name }}</div>
          <span class="dropdown-arrow">▼</span>
        </div>
        <div v-if="userMenuOpen" class="user-dropdown">
          <div class="user-info-dropdown">
            <strong>{{ currentUser?.name }}</strong>
            <small>{{ currentUser?.email }}</small>
          </div>
          <div class="dropdown-divider"></div>
          <button @click="handleLogout" class="logout-dropdown-btn">🚪 Sair do sistema</button>
        </div>
      </div>

      <!-- Menu de navegação -->
      <div style="position: relative;">
        <button class="menu-hamburger" :class="{ activeHam: activeTab === 'chats' }" @click="toggleSidebar">☰</button>
        <div class="top-menu">
          <div class="menu-item" :class="{ active: activeTab === 'chats' }" @click="activeTab = 'chats'">💬 Chats</div>
          <div class="menu-item" :class="{ active: activeTab === 'graficos' }" @click="activeTab = 'graficos'">📈
            Gráficos</div>
          <div class="menu-item" :class="{ active: activeTab === 'configuracoes' }"
            @click="activeTab = 'configuracoes'">⚙️ Configurações</div>
          <button class="broadcast-btn" @click="openBroadcastModal">📢</button>
        </div>
      </div>

      <!-- Conteúdo principal -->
      <div class="main-content">

        <tab-chats></tab-chats>

        <!-- ABA CONFIGURAÇÕES -->
        <div class="tab-configuracoes" :class="{ hidden: activeTab !== 'configuracoes' }">
          <div class="config-container">
            <div class="config-sidebar">
              <div class="config-sidebar-item" :class="{ active: configSubtab === 'users' }"
                @click="configSubtab = 'users'">👥 Usuários</div>
              <div class="config-sidebar-item" :class="{ active: configSubtab === 'channels' }"
                @click="configSubtab = 'channels'">🔌 Canais</div>
              <div class="config-sidebar-item" :class="{ active: configSubtab === 'integracao' }"
                @click="configSubtab = 'integracao'">⛓️ Integrações</div>
            </div>

            <div class="config-content">
              <config-users></config-users>
              <config-channels></config-channels>
              <config-integracao></config-integracao>
            </div>
          </div>
        </div>

        <tab-graficos></tab-graficos>
      </div>

      <!-- MODAIS -->
      <app-modals></app-modals>

      <!-- Alerta -->
      <div class="alerta" :class="{ 'alerta-success': isSuccess, 'alerta-error': !isSuccess }" v-if="showAlerta">
        <span>{{ alertaMessage }}</span>
      </div>

    </template>
    <template v-else>
      <div style="display: flex; justify-content: center; align-items: center; height: 100vh;">
        <div>Verificando autenticação...</div>
      </div>
    </template>
  </div>

  <script src="chartHandler.js"></script>
  <script src="useFormataMessagem.js"></script>
  <script src="useNotifications.js"></script>
  <script src="modules/Useusers.js"></script>
  <script src="modules/Usechannels.js"></script>
  <script src="modules/Useintegracao.js"></script>
  <script src="modules/Usetickets.js"></script>
  <script src="modules/Usebroadcast.js"></script>
  <script src="modules/Useqrcode.js"></script>
  <script src="modules/Usegraficos.js"></script>
  <script src="app.js"></script>
</body>

</html>
